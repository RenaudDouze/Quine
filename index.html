<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Filet de secours pour les navigateurs qui ne savent pas utiliser un
         favicon SVG comme icône de raccourci (ex : "Ajouter à l'écran
         d'accueil" de Firefox Android, qui se rabat sur ce lien plutôt que
         sur les icônes du manifest.webmanifest) : sans lui, l'icône ajoutée
         au bureau reste générique. -->
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Créez et jouez à vos propres grilles de bingo personnalisées." />
    <!--
      Défense en profondeur (l'app échappe déjà tout contenu utilisateur à
      chaque point de rendu — voir CLAUDE.md) : bloque l'exécution de tout
      script injecté ou hébergé ailleurs qu'ici en cas de faille non détectée.
      script-src reste strict ('self' uniquement, pas de inline/eval) grâce au
      script de thème externalisé dans set-theme.js. style-src/img-src/
      connect-src sont plus permissifs par nécessité : couleurs/confetti
      posés en style inline par React, images de fond et code de synchro
      pointant vers des origines choisies par l'utilisateur (voir GridCard.tsx
      et useRemoteSync.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; base-uri 'self'; form-action 'self';"
    />
    <title>Quine</title>
    <script src="./set-theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

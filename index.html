<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="Créez et jouez à vos propres grilles de bingo personnalisées." />
  <title>Bingo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <template id="tpl-home">
    <header class="topbar">
      <h1>🎉 Mes grilles</h1>
      <button class="btn btn-primary" data-action="new-grid">+ Nouvelle grille</button>
    </header>
    <div class="grid-list" data-role="grid-list"></div>
    <div class="empty-state" data-role="empty-state" hidden>
      <p>Aucune grille pour le moment.</p>
      <button class="btn btn-primary" data-action="new-grid">Créer ma première grille</button>
    </div>
  </template>

  <template id="tpl-card">
    <button class="card" data-role="open">
      <span class="card-title" data-role="title"></span>
      <span class="card-meta" data-role="meta"></span>
    </button>
    <div class="card-actions">
      <button class="icon-btn" data-action="edit" title="Modifier" aria-label="Modifier">✏️</button>
      <button class="icon-btn" data-action="duplicate" title="Dupliquer" aria-label="Dupliquer">📋</button>
      <button class="icon-btn icon-btn-danger" data-action="delete" title="Supprimer" aria-label="Supprimer">🗑️</button>
    </div>
  </template>

  <template id="tpl-editor">
    <header class="topbar">
      <button class="btn btn-ghost" data-action="back">← Retour</button>
      <h1 data-role="editor-title">Nouvelle grille</h1>
    </header>
    <form class="editor" data-role="form">
      <label class="field">
        <span>Titre de la grille</span>
        <input type="text" name="title" placeholder="Ex : Bingo réunion d'équipe" required maxlength="60" />
      </label>

      <label class="field">
        <span>Taille de la grille</span>
        <select name="size">
          <option value="3">3 × 3 (9 cases)</option>
          <option value="4">4 × 4 (16 cases)</option>
          <option value="5" selected>5 × 5 (25 cases)</option>
        </select>
      </label>

      <label class="field checkbox-field">
        <input type="checkbox" name="freeCenter" />
        <span>Case centrale libre ("GRATUIT") — grilles de taille impaire</span>
      </label>

      <label class="field">
        <span>Vos cases (une par ligne)</span>
        <textarea name="items" rows="10" placeholder="Écrivez chaque phrase ou mot sur une ligne...&#10;Ex :&#10;Quelqu'un dit &quot;synergie&quot;&#10;Un chien aboie&#10;Café renversé"></textarea>
      </label>
      <p class="hint" data-role="count-hint"></p>

      <div class="editor-actions">
        <button type="submit" class="btn btn-primary">Générer la grille</button>
      </div>
    </form>
  </template>

  <template id="tpl-play">
    <header class="topbar">
      <button class="btn btn-ghost" data-action="back">← Retour</button>
      <h1 data-role="play-title">Grille</h1>
      <button class="icon-btn" data-action="edit" title="Modifier" aria-label="Modifier">✏️</button>
    </header>
    <div class="board-wrap">
      <div class="board" data-role="board"></div>
    </div>
    <div class="play-actions">
      <button class="btn btn-secondary" data-action="shuffle">🔀 Remélanger</button>
      <button class="btn btn-secondary" data-action="reset">↺ Réinitialiser les coches</button>
    </div>
    <div class="bingo-banner" data-role="banner" hidden>
      <div class="bingo-banner-inner">
        <span>🎉 BINGO ! 🎉</span>
      </div>
    </div>
  </template>

  <script src="js/app.js"></script>
</body>
</html>

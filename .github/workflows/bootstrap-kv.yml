name: Bootstrap - créer l'espace KV du worker (temporaire)

on:
  workflow_dispatch:

jobs:
  create-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npx wrangler kv namespace list
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Un titre distinct de "SYNC_KV" : ce compte a déjà un espace nommé
      # ainsi (celui de +1, même nom de binding) - le titre Cloudflare n'a
      # pas besoin de correspondre au binding utilisé dans wrangler.toml.
      - run: npx wrangler kv namespace create bingo-sync-kv
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
